[workspace]
resolver = "2"
members = ["crates/flashgov-core", "crates/flashgovd", "crates/flashgov-sim"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"

[workspace.dependencies]
flashgov-core = { path = "crates/flashgov-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

# The daemon is a long-lived resident process on a car head unit: optimise for
# size and cold start, not throughput. `panic = "abort"` is deliberate: a panic
# in a governor must not unwind into a half-applied policy.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
